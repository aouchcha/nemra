services:
  livekit:
    image: 'livekit/livekit-server:latest'
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: "--config /etc/livekit.yaml"

  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=nemraDb'
      - 'POSTGRES_PASSWORD=nemra2026@@'
      - 'POSTGRES_USER=ouahid'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
    pgdata: