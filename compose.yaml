services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nemraDb
      POSTGRES_USER: ouahid
      POSTGRES_PASSWORD: nemra2026@@
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouahid -d nemraDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/nemraDb"
      SPRING_DATASOURCE_USERNAME: "ouahid"
      SPRING_DATASOURCE_PASSWORD: "nemra2026@@"
      JWT_SECRET: "9f8e7d6c5b4a3a2f1e0d9c8b7a6f5e4d3c2b1a0987654321"
      JWT_ACCESS_TOKEN_EXPIRATION: "1800000"
      JWT_REFRESH_TOKEN_EXPIRATION: "604800000"
      R2_ENDPOINT: "https://d8f2022fbc67e0116f7c89eee783c7a0.r2.cloudflarestorage.com"
      R2_ACCESS_KEY: "337f3cb8f9f65d3ebb82792d52a58670"
      R2_SECRET_KEY: "c8903f003c8f5b5cfcb97dbe5a9f16818c35ce9164047459a7395f230e911bb3"
      R2_BUCKET: "nemra-storage"
      R2_PUBLIC_URL: "https://pub-8b8ff1011297433390f5ec33a60bbcd0.r2.dev"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "devsecret"
      LIVEKIT_URL: "ws://livekit:7880"
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
